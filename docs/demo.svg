<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e94560" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Drone AI - Autonomous Vehicle Intelligence</text>
  
  <!-- Sensors Box -->
  <rect x="50" y="80" width="150" height="120" rx="10" fill="url(#boxGrad)" stroke="#e94560" stroke-width="2"/>
  <text x="125" y="105" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">SENSORS</text>
  <text x="125" y="130" text-anchor="middle" fill="#aaa" font-family="Arial, sans-serif" font-size="11">Camera</text>
  <text x="125" y="150" text-anchor="middle" fill="#aaa" font-family="Arial, sans-serif" font-size="11">LiDAR</text>
  <text x="125" y="170" text-anchor="middle" fill="#aaa" font-family="Arial, sans-serif" font-size="11">IMU + GPS</text>
  
  <!-- Vision Box -->
  <rect x="250" y="80" width="150" height="120" rx="10" fill="url(#boxGrad)" stroke="#00d9ff" stroke-width="2"/>
  <text x="325" y="105" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">VISION</text>
  <text x="325" y="130" text-anchor="middle" fill="#aaa" font-family="Arial, sans-serif" font-size="11">YOLOv8 Detection</text>
  <text x="325" y="150" text-anchor="middle" fill="#aaa" font-family="Arial, sans-serif" font-size="11">Visual SLAM</text>
  <text x="325" y="170" text-anchor="middle" fill="#aaa" font-family="Arial, sans-serif" font-size="11">Object Tracking</text>
  
  <!-- Planning Box -->
  <rect x="450" y="80" width="150" height="120" rx="10" fill="url(#boxGrad)" stroke="#00ff88" stroke-width="2"/>
  <text x="525" y="105" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">PLANNING</text>
  <text x="525" y="130" text-anchor="middle" fill="#aaa" font-family="Arial, sans-serif" font-size="11">A* Pathfinding</text>
  <text x="525" y="150" text-anchor="middle" fill="#aaa" font-family="Arial, sans-serif" font-size="11">RRT* Algorithm</text>
  <text x="525" y="170" text-anchor="middle" fill="#aaa" font-family="Arial, sans-serif" font-size="11">Obstacle Avoidance</text>
  
  <!-- Decision Box -->
  <rect x="300" y="240" width="200" height="100" rx="10" fill="url(#boxGrad)" stroke="#ffcc00" stroke-width="2"/>
  <text x="400" y="270" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">DECISION ENGINE</text>
  <text x="400" y="295" text-anchor="middle" fill="#aaa" font-family="Arial, sans-serif" font-size="11">Behavior Trees + RL Agent</text>
  <text x="400" y="315" text-anchor="middle" fill="#aaa" font-family="Arial, sans-serif" font-size="11">Safety Systems</text>
  
  <!-- Communication Box -->
  <rect x="300" y="380" width="200" height="80" rx="10" fill="url(#boxGrad)" stroke="#ff6b6b" stroke-width="2"/>
  <text x="400" y="410" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">COMMUNICATION</text>
  <text x="400" y="435" text-anchor="middle" fill="#aaa" font-family="Arial, sans-serif" font-size="11">MAVLink + ROS 2</text>
  
  <!-- Drone Icon -->
  <g transform="translate(650, 250)">
    <ellipse cx="50" cy="50" rx="60" ry="20" fill="none" stroke="#e94560" stroke-width="2" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="30" y="40" width="40" height="20" rx="5" fill="#333" stroke="#e94560" stroke-width="2"/>
    <circle cx="20" cy="50" r="8" fill="#333" stroke="#00d9ff" stroke-width="2"/>
    <circle cx="80" cy="50" r="8" fill="#333" stroke="#00d9ff" stroke-width="2"/>
    <line x1="20" y1="50" x2="35" y2="50" stroke="#666" stroke-width="2"/>
    <line x1="65" y1="50" x2="80" y2="50" stroke="#666" stroke-width="2"/>
  </g>
  <text x="700" y="330" text-anchor="middle" fill="#e94560" font-family="Arial, sans-serif" font-size="12">DRONE</text>
  
  <!-- Animated Data Flow Lines -->
  <line x1="200" y1="140" x2="250" y2="140" stroke="#e94560" stroke-width="2" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="400" y1="140" x2="450" y2="140" stroke="#00d9ff" stroke-width="2" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </line>
  <line x1="325" y1="200" x2="350" y2="240" stroke="#00d9ff" stroke-width="2" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="1s"/>
  </line>
  <line x1="525" y1="200" x2="450" y2="240" stroke="#00ff88" stroke-width="2" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="1s"/>
  </line>
  <line x1="400" y1="340" x2="400" y2="380" stroke="#ffcc00" stroke-width="2" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </line>
  <line x1="500" y1="420" x2="640" y2="300" stroke="#ff6b6b" stroke-width="2" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="2s"/>
  </line>
  
  <!-- Tech Stack -->
  <text x="50" y="480" fill="#666" font-family="Arial, sans-serif" font-size="10">Python | TensorFlow | PyTorch | OpenCV | ROS 2 | MAVLink</text>
</svg>
